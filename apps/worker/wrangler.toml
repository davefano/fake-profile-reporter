name = "api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "fpr"
database_id = "7892677c-8926-4268-ad67-fadfb1f6c8b9"

# KV used for per-IP cooldown + daily rate limits.
[[kv_namespaces]]
binding = "RATE_KV"
id = "573f08b711714654848e2fe49f05c7f8"

# Raw profile snapshots (gzipped JSON), keyed snapshots/<memberId>/<time>.json.gz
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "fpr-snapshots"

# IP_SALT (salt for anonymous IP hashing) is a secret: `wrangler secret put
# IP_SALT` in production, and .dev.vars locally (copy .dev.vars.example).
