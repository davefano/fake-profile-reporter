name = "api"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "fpr"
database_id = "7892677c-8926-4268-ad67-fadfb1f6c8b9"

# KV used for per-IP cooldown + daily rate limits.
[[kv_namespaces]]
binding = "RATE_KV"
id = "573f08b711714654848e2fe49f05c7f8"

# Raw profile snapshots (gzipped JSON), keyed snapshots/<memberId>/<time>.json.gz
[[r2_buckets]]
binding = "SNAPSHOTS"
bucket_name = "fpr-snapshots"

# IP_SALT (salt for anonymous IP hashing) is a secret: `wrangler secret put
# IP_SALT` in production, and .dev.vars locally (copy .dev.vars.example).

# Bot check (Cloudflare Turnstile, src/verify.ts). Off while VERIFY_HOST is
# unset: no /verify page and no check, which suits forks and your own server.
# To turn it on, set VERIFY_HOST to the host that serves this worker (e.g.
# api.example.com) under [vars], and put the widget's keys as secrets:
# `wrangler secret put TURNSTILE_SITEKEY` and `wrangler secret put
# TURNSTILE_SECRET`. With VERIFY_HOST set and a key missing, reports are
# refused (503), never accepted unchecked.
# [vars]
# VERIFY_HOST = "api.example.com"

# The Community server has it on.
[vars]
VERIFY_HOST = "api.fake-profile-reporter.workers.dev"

# Daily retention deletes (src/removals.ts): old removal-request contacts and
# decided requests, expired bot-check rows, earlier days' counters.
[triggers]
crons = ["17 3 * * *"]

# Removal review (/api/admin/*, src/removals.ts) needs ADMIN_TOKEN, a secret of
# at least 32 random bytes: `openssl rand -base64 32 | wrangler secret put
# ADMIN_TOKEN`. While it's unset or shorter than 43 characters, admin routes
# answer 404.
