<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype · panel aesthetic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Geist+Pixel&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dialkit@2.0.0/dist/vanilla/styles.css">
<script src="https://cdn.jsdelivr.net/npm/dialkit@2.0.0/dist/vanilla/browser.global.js"></script>
<style>
/* ---------- prototype chrome (not product) ---------- */
html, body { margin: 0; }
body { font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; background: #d9d7d2; color: #222; min-height: 100vh; }
.stage { display: flex; gap: 24px; align-items: flex-start; padding: 20px; }
.ctl { position: sticky; top: 20px; width: 230px; flex: none; display: grid; gap: 14px; font-size: 12px; }
.ctl h1 { font-size: 13px; margin: 0; }
.ctl p.mock { margin: 0; color: #8a5a00; }
.ctl fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 4px; }
.ctl legend { font-weight: 650; margin-bottom: 2px; padding: 0; }
.ctl label { display: grid; grid-template-columns: 16px 1fr; column-gap: 6px; align-items: baseline; cursor: pointer; }
.ctl label small { grid-column: 2; color: #666; }
.ctl button { font: inherit; padding: 6px 10px; border: 1px solid #888; background: #fff; cursor: pointer; color: #222; }
.ctl .copied { color: #23793a; }
.ctl input[readonly] { width: 100%; font: 11px ui-monospace, monospace; }
.ctl-toggle { display: none; }
.frame { flex: none; overflow: hidden; box-shadow: 0 1px 2px rgb(0 0 0 / .2), 0 10px 30px rgb(0 0 0 / .18); }
@media (max-width: 600px) {
  .stage { flex-direction: column; padding: 0; gap: 0; }
  .ctl { position: static; width: auto; padding: 12px 16px; background: rgb(0 0 0 / .05); }
  .ctl-toggle { display: block; }
  .ctl.closed > :not(.ctl-toggle) { display: none; }
  .frame { width: 100% !important; box-shadow: none; }
}

/* ---------- product panel: shared structure (layout A) ---------- */
.p {
  --sans: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", "JetBrainsMono Nerd Font", ui-monospace, "SF Mono", Menlo, monospace;
  background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased; min-height: 780px; position: relative;
}
/* Omarchy palettes: backgrounds, text and accent from the theme; flag/ok/warn are ours (theme colour names aren't meanings). */
.p[data-pal="tokyo-night"] { --bg:#1a1b26; --raised:#24283b; --deep:#13141c; --line:#292e42; --line2:#414868; --text:#c0caf5; --text2:#a9b1d6; --text3:#7c84ad; --accent:#7aa2f7; --flag:#ff7a85; --ok:#8fd9a2; --warn:#e0af68; --on-accent:#13141c; color-scheme: dark; }
.p[data-pal="matte-black"] { --bg:#121212; --raised:#1e1e1e; --deep:#0d0d0d; --line:#2a2a2a; --line2:#3a3a3a; --text:#e4e4e4; --text2:#bebebe; --text3:#8a8a8d; --accent:#e68e0d; --flag:#ff7a72; --ok:#8fd99b; --warn:#e6b94d; --on-accent:#121212; color-scheme: dark; }
.p[data-pal="lumon"] { --bg:#16242d; --raised:#1b2d40; --deep:#101b21; --line:#243d56; --line2:#304860; --text:#f2fcff; --text2:#d6e2ee; --text3:#93b6d1; --accent:#8bc9eb; --flag:#ff8f94; --ok:#90dbab; --warn:#f0c26a; --on-accent:#101b21; color-scheme: dark; }
.p[data-pal="ink"] { --bg:#0f0f10; --raised:#18181a; --deep:#0a0a0b; --line:#232326; --line2:#34343a; --text:#ededee; --text2:#b9b9bf; --text3:#8b8b93; --accent:#3d9bff; --flag:#ff6b7d; --ok:#5fe0a0; --warn:#ffb54d; --on-accent:#0a0a0b; color-scheme: dark; }
.p[data-pal="flexoki-light"] { --bg:#FFFCF0; --raised:#F2F0E5; --deep:#E6E4D9; --line:#E6E4D9; --line2:#CECDC3; --text:#100F0F; --text2:#403E3C; --text3:#6F6E69; --accent:#205EA6; --flag:#AF3029; --ok:#66800B; --warn:#AD8301; --on-accent:#FFFCF0; color-scheme: light; }

.p * { box-sizing: border-box; }
.p :where(h1, h2, h3, p, ul, dl, dd) { margin: 0; padding: 0; }
.p :where(ul) { list-style: none; }
.p :where(button) { font: inherit; color: inherit; }
.p :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); }

.top { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px 0; }
.appname { font-weight: 600; font-size: 13px; }
.dest { font: 12px var(--mono); color: var(--text3); }
.bar .sp { flex: 1; }
.ib { width: 28px; height: 28px; border: 0; background: none; color: var(--text3); display: grid; place-items: center; cursor: pointer; }
.ib:hover { background: var(--raised); color: var(--text); }
.ib[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.ib svg { width: 16px; height: 16px; }
.tabs { display: flex; gap: 16px; padding: 6px 16px 0; }
.tabs button { border: 0; background: none; padding: 6px 0 8px; font-size: 13px; color: var(--text3); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--text); border-color: var(--accent); }

.main { padding: 16px 16px 120px; display: grid; gap: 18px; }
.who { display: flex; gap: 12px; align-items: center; }
.av { width: 42px; height: 42px; background: var(--raised); display: grid; place-items: center; font: 600 14px var(--mono); color: var(--text2); flex: none; }
.who h1 { font-size: 16px; font-weight: 650; line-height: 1.25; }
.who p { font-size: 13px; color: var(--text2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.who .meta { font: 12px var(--mono); color: var(--text3); margin-top: 2px; }

.lvl h2 { font-size: 20px; font-weight: 650; letter-spacing: -.015em; line-height: 1.2; }
.lvl p { margin-top: 4px; color: var(--text2); font-size: 13.5px; max-width: 46ch; text-wrap: pretty; }
.lvl .tag { display: inline-block; font: 600 11px var(--mono); padding: 2px 6px; margin-bottom: 8px; }
.lvl.high .tag { color: var(--flag); border: 1px solid var(--flag); }
.lvl.medium .tag { color: var(--warn); border: 1px solid var(--warn); }
.lvl.low .tag { color: var(--ok); border: 1px solid var(--ok); }

.bal { display: grid; gap: 8px; }
.bal-row { display: grid; grid-template-columns: 9em 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.bal-row .lab { color: var(--text2); }
.bal-row .n { font: 12px var(--mono); color: var(--text3); text-align: right; min-width: 7.5em; font-variant-numeric: tabular-nums; }
.track { height: 8px; background: var(--raised); position: relative; }
.track i { position: absolute; inset: 0 auto 0 0; }
.fl .track i { background: var(--flag); } .fv .track i { background: var(--ok); }
.segs { display: flex; gap: 2px; }
.segs b { height: 10px; flex: 1; background: var(--line2); opacity: .55; }
.segs b.on { opacity: 1; }
.fl .segs b.on { background: var(--flag); } .fv .segs b.on { background: var(--ok); }

.cols { display: grid; gap: 18px; }
.col h3 { font-size: 13px; font-weight: 650; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.col h3 small { font: 12px var(--mono); color: var(--text3); }
.col li { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.col li:first-child { border-top: 0; }
.col li .mk { font: 600 13px var(--mono); line-height: 1.5; }
.against .mk { color: var(--flag); } .for .mk { color: var(--ok); }
.col li .why { display: block; color: var(--text3); font-size: 12px; }
.col li .str { font: 11px var(--mono); color: var(--text3); padding-top: 2px; }
.col li.major .t { font-weight: 600; }
.against li.major .str { color: var(--flag); }

.nc { font-size: 12.5px; color: var(--text2); }
.nc .mk { font-family: var(--mono); color: var(--text3); margin-right: 6px; }
.facts { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.p[data-look="tiled"] .facts { border-bottom: 0; padding-bottom: 0; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-top: 14px; border-top: 1px solid var(--line); }
.facts dt { font: 11.5px var(--mono); color: var(--text3); }
.facts dd { font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.facts dd small { display: block; font-weight: 400; color: var(--text3); font-size: 12px; }
.foot { font-size: 12px; color: var(--text3); }
.foot button { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }

/* actions + report flow */
.act { position: sticky; bottom: 0; z-index: 2; background: var(--bg); border-top: 1px solid var(--line); padding: 12px 16px 14px; margin: 0 -16px; }
.act.open { position: static; }
.row { display: flex; gap: 8px; }
.btn { padding: 8px 12px; font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid var(--line2); background: var(--bg); color: var(--text); }
.btn:hover:not(:disabled) { background: var(--raised); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.grow { flex: 1; }
.btn.danger { background: var(--flag); border-color: var(--flag); color: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger:hover:not(:disabled), .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.lnk { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; }
.lnk:hover { text-decoration: underline; text-underline-offset: 2px; }
.lnk.quiet { color: var(--text2); }
.alt { margin-top: 8px; font-size: 12.5px; color: var(--text3); }
.sheet { display: grid; gap: 14px; }
.sheet h3 { font-size: 14px; font-weight: 650; }
.sheet fieldset { border: 0; padding: 0; margin: 0; }
.fl-l { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; display: block; padding: 0; }
.fl-l span { font-weight: 400; color: var(--text3); }
.seg { display: grid; gap: 6px; }
.seg label { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 8px 10px; border: 1px solid var(--line2); cursor: pointer; font-size: 13px; }
.seg label:has(input:checked) { border-color: var(--accent); background: var(--raised); }
.seg input, .sure input { margin: 3px 0 0; accent-color: var(--accent); }
.seg small { display: block; color: var(--text3); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { display: inline-flex; align-items: center; padding: 5px 9px; border: 1px solid var(--line2); font-size: 12.5px; cursor: pointer; }
.chips label:has(input:checked) { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.sure { display: flex; gap: 14px; font-size: 13px; }
.sure label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
textarea.note { width: 100%; min-height: 64px; resize: vertical; font: 13px var(--sans); color: var(--text); background: var(--deep); border: 1px solid var(--line2); padding: 8px 10px; }
.note-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text3); margin-top: 4px; }
.note-meta .mono { font-size: 11.5px; }
.err { color: var(--flag); font-size: 12.5px; }
.done { display: grid; gap: 4px; }
.done .what { font-size: 13px; } .done .what b { font-weight: 600; }
.done .sub { font: 12px var(--mono); color: var(--text3); }
.done .row { margin-top: 6px; gap: 14px; align-items: center; }
.done.offline .sub { color: var(--warn); }
.toast { font-size: 12.5px; color: var(--ok); margin-bottom: 8px; }

/* ===== Look 1: terminal, made friendly ===== */
/* Square, hairlines, mono for every label and datum; sentences stay in Inter. */
.p[data-look="term"] .appname { font-family: var(--mono); font-weight: 600; }
.p[data-look="term"] .appname::before { content: "› "; color: var(--accent); }
.p[data-look="term"] .tabs button { font-family: var(--mono); font-size: 12.5px; }
.p[data-look="term"] .lvl .tag::before { content: "status: "; color: var(--text3); font-weight: 400; }
.p[data-look="term"] .lvl .tag { border: 0; padding: 0; }
.p[data-look="term"] .col h3 { font: 600 12.5px var(--mono); }
.p[data-look="term"] .col h3 small::before { content: "n="; }
.p[data-look="term"] .col li { border-top-style: dashed; }
.p[data-look="term"] .facts { grid-template-columns: 1fr; gap: 2px; border-top-style: dashed; }
.p[data-look="term"] .facts > div { display: grid; grid-template-columns: 7.5em 1fr; gap: 10px; font-family: var(--mono); font-size: 12.5px; }
.p[data-look="term"] .facts dt::after { content: ""; }
.p[data-look="term"] .facts dd { font-weight: 500; }
.p[data-look="term"] .facts dd small { display: inline; margin-left: 8px; font-size: 12px; }
.p[data-look="term"] .track { height: 6px; }
.p[data-look="term"] .btn, .p[data-look="term"] .chips label { font-family: var(--mono); font-size: 12.5px; }
.p[data-look="term"] .foot { font-family: var(--mono); font-size: 11.5px; }

/* ===== Look 2: tiled panes ===== */
/* Each section is a window: square border, a title set into the top edge, gaps like Hyprland. The focused pane gets the accent border. */
.p[data-look="tiled"] { background: var(--deep); }
.p[data-look="tiled"] .top { background: var(--deep); }
.p[data-look="tiled"] .main { gap: 10px; padding-top: 12px; }
.p[data-look="tiled"] .pane { position: relative; border: 1px solid var(--line2); background: var(--bg); padding: 16px 12px 12px; }
.p[data-look="tiled"] .pane.focus { border: 2px solid var(--accent); padding: 15px 11px 11px; }
.p[data-look="tiled"] .pane > .pt { position: absolute; top: -8px; left: 8px; padding: 0 6px; background: var(--deep); font: 500 11.5px var(--mono); color: var(--text3); line-height: 15px; }
.p[data-look="tiled"] .pane.focus > .pt { color: var(--accent); top: -9px; }
.p[data-look="tiled"] .who { padding: 2px 0; }
.p[data-look="tiled"] .facts { border-top: 0; padding-top: 0; }
.p[data-look="tiled"] .act { background: var(--deep); }
.p[data-look="tiled"] .act .sheet, .p[data-look="tiled"] .act .done { border: 2px solid var(--accent); background: var(--bg); padding: 14px 12px 12px; position: relative; }
.p[data-look="tiled"] .tabs button[aria-selected="true"] { border-color: var(--accent); }

/* ===== Look 3: instrument readout ===== */
/* One accent, segmented gauges, numbers that line up; plain sentences, generous spacing. */
.p[data-look="readout"] .main { gap: 22px; }
.p[data-look="readout"] .lvl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; }
.p[data-look="readout"] .lvl .tag { grid-row: span 2; margin: 0; width: 64px; height: 64px; display: grid; place-items: center; font: 700 26px var(--mono); padding: 0; border-width: 2px; }
.p[data-look="readout"] .lvl p { margin-top: 0; }
.p[data-look="readout"] .bal { gap: 12px; padding: 12px; background: var(--raised); }
.p[data-look="readout"] .bal-row { grid-template-columns: 1fr; gap: 6px; }
.p[data-look="readout"] .bal-row .top-l { display: flex; justify-content: space-between; font-size: 13px; }
.p[data-look="readout"] .bal-row .top-l b { font: 600 13px var(--mono); }
.p[data-look="readout"] .fl .top-l b { color: var(--flag); } .p[data-look="readout"] .fv .top-l b { color: var(--ok); }
.p[data-look="readout"] .col li .str { font-weight: 600; }
.p[data-look="readout"] .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); padding: 0; }
.p[data-look="readout"] .facts > div { background: var(--bg); padding: 8px 10px; }
.p[data-look="readout"] .facts dd { font: 600 15px var(--mono); }
.p[data-look="readout"] .facts dd small { font-family: var(--sans); }

/* ===== settings screen ===== */
.set { display: grid; gap: 28px; }
.set h2 { font-size: 18px; font-weight: 650; }
.p[data-look="mix"] .set h2, .p[data-look="dither"] .set h2 { font: 400 24px var(--pixel); }
.set section { display: grid; gap: 10px; }
.set h3 { font-size: 13px; font-weight: 650; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.set h3 .rule { height: 6px; background: repeating-conic-gradient(var(--line2) 0 25%, transparent 0 50%) 0 0 / 4px 4px; }
.set .hint { font-size: 12.5px; color: var(--text3); margin-top: -4px; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line2); cursor: pointer; font-size: 13.5px; border-radius: var(--radius, 0); align-items: start; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--raised); }
.opt input { margin: 3px 0 0; accent-color: var(--accent); }
.opt small { display: block; color: var(--text3); font-size: 12px; }
.opt small .om { font-family: var(--mono); }
.pals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pal { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; padding: 8px; border: 1px solid var(--line2); cursor: pointer; border-radius: var(--radius, 0); }
.pal:has(input:checked) { border: 2px solid var(--accent); padding: 7px; }
.pal:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.pal input { position: absolute; opacity: 0; pointer-events: none; }
.pal .sw { box-shadow: inset 0 0 0 1px var(--line2); height: 52px; display: grid; grid-template-columns: 1fr auto; padding: 8px; gap: 4px; border-radius: calc(var(--radius, 0px) / 2); }
.pal .sw .lines { display: grid; gap: 4px; align-content: start; }
.pal .sw .lines i { display: block; height: 4px; border-radius: 1px; }
.pal .sw .dots { display: grid; grid-auto-flow: column; gap: 3px; align-self: end; }
.pal .sw .dots i { width: 9px; height: 9px; display: block; }
.pal .sw.split { background: linear-gradient(135deg, var(--a-bg) 0 50%, var(--b-bg) 50% 100%) !important; }
.pal b { font-size: 13px; font-weight: 600; }
.pal small { display: block; font-size: 11.5px; color: var(--text3); margin-top: -6px; }
.pal .om { font: 10.5px var(--mono); color: var(--text3); }
.p .btn-row2 { display: flex; gap: 8px; }

/* ===== Look 5: readout x dither (tuned with DialKit) ===== */
.p[data-look="mix"] {
  --sans: "Geist", "Inter", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", "JetBrains Mono", ui-monospace, monospace; --pixel: "Geist Pixel", "Geist Mono", ui-monospace, monospace;
  --gap: 32px; --gutter: 24px; --row-pad: 12px; --radius: 4px; --body: 14px; --h: 28px; --tag: 56px; --tag-bw: 2px; --gauge-h: 20px; --box-pad: 16px; --fact-v: 16px; --av: 56px;
}
.p[data-look="mix"] .main { gap: var(--gap); padding-left: var(--gutter); padding-right: var(--gutter); }
.p[data-look="mix"] .bar, .p[data-look="mix"] .tabs { padding-left: var(--gutter); padding-right: var(--gutter); }
.p[data-look="mix"] .act { margin: 0 calc(var(--gutter) * -1); padding-left: var(--gutter); padding-right: var(--gutter); }
.p[data-look="mix"] .appname { font: 400 15px var(--pixel); }
.p[data-look="mix"] .dest, .p[data-look="mix"] .who .meta, .p[data-look="mix"] .facts dt { text-transform: lowercase; }
.p[data-look="mix"] .av { background: none; width: var(--av); height: var(--av); }
.p[data-look="mix"] .av canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; border-radius: var(--radius); }
.p[data-look="mix"] .who { align-items: start; }
.p[data-look="mix"] .who h1 { text-box: trim-start cap alphabetic; }
.p[data-look="mix"] .lvl { position: relative; isolation: isolate; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr; gap: 8px 14px; align-items: start; }
.p[data-look="mix"] .lvl canvas.wash { position: absolute; inset: calc(var(--gap) * -0.4) calc(var(--gutter) * -1); width: calc(100% + var(--gutter) * 2); height: calc(100% + var(--gap) * 0.8); z-index: -1; image-rendering: pixelated; }
.p[data-look="mix"] .lvl .tag { grid-row: span 2; margin: 0; width: var(--tag); height: var(--tag); display: grid; place-items: center; font: 400 calc(var(--tag) * 0.34) var(--pixel); padding: 0; border-width: var(--tag-bw); border-radius: var(--radius); }
.p[data-look="mix"][data-tag="dither"] .lvl .tag { border: 0; background: radial-gradient(currentColor 1px, transparent 1.3px) 0 0 / 4px 4px; color: inherit; }
