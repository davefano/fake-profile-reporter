<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fake LinkedIn Reporter</title>
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">🚩</span>
    <div>
      <div class="title">Fake LinkedIn Reporter</div>
      <div class="api" id="apiBase"></div>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="grade">Grade</button>
    <button class="tab" data-tab="board">Leaderboard</button>
  </nav>
</header>

<main>
  <section id="view-grade" class="view active">
    <div id="loading" class="muted pad">Reading this profile…</div>

    <div id="state-empty" class="hidden">
      <div class="empty">
        <p>Open a LinkedIn profile (/in/…) and reopen this panel.</p>
        <button id="retry" class="btn ghost">Try again</button>
      </div>
    </div>

    <div id="state-error" class="hidden">
      <div class="empty">
        <p id="errorText">Something went wrong.</p>
        <button id="retry2" class="btn ghost">Try again</button>
      </div>
    </div>

    <div id="result" class="hidden">
      <div class="profile">
        <img id="avatar" class="avatar" alt="" />
        <div class="who">
          <div id="name" class="name"></div>
          <div id="headline" class="headline"></div>
          <a id="profileLink" class="link" target="_blank" rel="noopener">Open profile ↗</a>
        </div>
      </div>

      <div class="scorecard" id="scorecard">
        <div class="gauge">
          <div class="gauge-num" id="scoreNum">0</div>
          <div class="gauge-label">fake score</div>
        </div>
        <div class="level" id="levelBadge">—</div>
      </div>

      <div class="signals" id="signals"></div>

      <div class="reasons-wrap">
        <div class="section-title">Reasons</div>
        <ul class="reasons" id="reasons"></ul>
      </div>

      <div class="report">
        <button id="reportBtn" class="btn primary">Report to leaderboard</button>
        <div id="reportStatus" class="status"></div>
      </div>
    </div>
  </section>

  <section id="view-board" class="view">
    <div id="boardLoading" class="muted pad">Loading leaderboard…</div>
    <div id="boardList"></div>
  </section>
</main>

<script type="module" src="sidepanel.js"></script>
</body>
</html>
