name = "fake-linkedin-reporter"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Serve the leaderboard page and API from the worker's default route.

[[d1_databases]]
binding = "DB"
database_name = "flr"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# KV used for per-IP cooldown + daily rate limits.
[[kv_namespaces]]
binding = "RATE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Change before deploying. Salt for anonymous IP hashing.
IP_SALT = "change-me-in-production"
